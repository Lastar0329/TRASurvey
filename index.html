<style>
/* ── 深色主題 (現代沉穩), 依 iPhone 16 Pro Max 440×956 調整 ── */
:root {
  color-scheme: dark;
  --bg: #0B1220; --panel: #111A2B; --raised: #1A2539; --line: #1F2C43; --line2: #2E3E5C;
  --text: #E8EEF7; --muted: #9AA8BF; --faint: #67788F;
  --accent: #5AA9FF;    /* 主強調 / 現在 */
  --arrive: #3DDC97;    /* 抵達 / 準時 */
  --warn: #F5B454;      /* 晚到 / 轉乘很趕 */
  --bad: #FF6B6B;       /* 接不上 */
  --accent-bg: rgba(90,169,255,.14); --arrive-bg: rgba(61,220,151,.13);
  --warn-bg: rgba(245,180,84,.15);   --bad-bg: rgba(255,107,107,.15);
  --t-l: #5A6B91; --t-lf: #2F8F81; --t-e: #C25148; --t-p: #B5527F; --t-t: #7C5BA6; --t-c: #BD7A33;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --tbar-h: 66px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { background: var(--bg); -webkit-tap-highlight-color: transparent;
             -webkit-text-size-adjust: 100%; overscroll-behavior-y: contain; }
body { color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45;
       padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
       padding-bottom: calc(var(--tbar-h) + env(safe-area-inset-bottom) + 18px); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tn, .la-t, .it .t, .lv-t, .lv-cd { font-variant-numeric: tabular-nums; }
.muted { color: var(--faint); font-size: 13.5px; }

/* ── 頂端: 標題 + 誤點狀態 (動態島底下留安全區) ── */
.ah { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 12px;
      padding: calc(env(safe-area-inset-top) + 6px) 16px 10px; border-bottom: 1px solid var(--line); }
.ah-main { flex: 1; min-width: 0; }
.ah-tt { font-size: 22px; font-weight: 700; letter-spacing: .2px; line-height: 1.25; }
.ah-st { font-size: 12.5px; color: var(--faint); margin-top: 2px; line-height: 1.4; }
.ah-st.ok { color: var(--arrive); } .ah-st.warn { color: var(--warn); }
.ah-st.err { color: var(--bad); }   .ah-st.busy { color: var(--accent); }
.fbtn { flex: none; display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 17px;
        border: 1px solid var(--line2); font-size: 13.5px; color: var(--muted); }
.fbtn.on { color: var(--accent); border-color: rgba(90,169,255,.55); background: var(--accent-bg); }
.fbtn svg { width: 17px; height: 17px; }

/* ── 底部分頁列 (大螢幕單手按得到) + 右側唯一的更新鈕 ── */
.tbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 2px;
        padding: 6px calc(14px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
        background: var(--bg); border-top: 1px solid var(--line); }
.tb-i { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0 3px;
        font-size: 11.5px; font-weight: 600; color: var(--faint); }
.tb-i svg { width: 25px; height: 25px; }
.tb-i.on { color: var(--accent); }
.rf { flex: none; width: 54px; height: 54px; margin-left: 8px; border-radius: 27px; display: flex; align-items: center;
      justify-content: center; background: var(--accent-bg); border: 1px solid rgba(90,169,255,.55); color: var(--accent); }
.rf svg { width: 26px; height: 26px; }
.rf.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 共用小元件 ── */
.now { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 12.5px; color: var(--accent); }
.now b { font-weight: 700; white-space: nowrap; }
.now i { flex: 1; height: 2px; border-radius: 1px; background: var(--accent); opacity: .5; }
.now span { color: var(--muted); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px;
        font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.chip.ok { background: var(--arrive-bg); color: var(--arrive); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.tp { display: inline-block; padding: 0 6px; border-radius: 5px; font-size: 12px; font-weight: 700;
      line-height: 19px; color: #fff; white-space: nowrap; }
.t-l { background: var(--t-l); } .t-lf { background: var(--t-lf); } .t-e { background: var(--t-e); }
.t-p { background: var(--t-p); } .t-t { background: var(--t-t); } .t-c { background: var(--t-c); }
.tn { font-weight: 600; }
.dl { display: inline-block; padding: 0 5px; border-radius: 5px; font-size: 11.5px; font-weight: 700;
      line-height: 18px; white-space: nowrap; }
.dl.late { background: var(--warn-bg); color: var(--warn); }
.dl.ok { background: var(--arrive-bg); color: var(--arrive); }
s { color: var(--faint); font-weight: 400; }
.gone { opacity: .42; }
.empty { margin: 16px; padding: 22px; text-align: center; color: var(--faint); background: var(--panel);
         border: 1px solid var(--line); border-radius: 16px; }
.chev { width: 15px; height: 15px; color: var(--faint); flex: none; transition: transform .2s; }

/* ── 路線清單 (版面 A): 一班一行, 點開看換車 ── */
.la { margin: 12px 16px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.la-row + .la-row, .la .now + .la-row, .la-row + .now { border-top: 1px solid var(--line); }
.la-sum { width: 100%; min-height: 58px; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 8px; text-align: left; }
.la-t { font-size: 23px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
.la-t.arr { color: var(--arrive); }
.la-t.late { color: var(--warn); }
.la-t s { font-size: 12px; margin-left: 5px; }
.la-ar { color: var(--faint); font-size: 15px; }
.la-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.la-dur { font-size: 14px; color: var(--muted); white-space: nowrap; }
.la-row.open .chev { transform: rotate(90deg); }
.la-det { display: none; padding: 2px 14px 14px; }
.la-row.open .la-det { display: block; }

/* 換車細節: 站 × 時間軸, 線段顏色 = 該段車種 */
.it { list-style: none; padding-top: 4px; }
.it li { display: grid; grid-template-columns: 50px 20px minmax(0,1fr) auto; column-gap: 8px; position: relative; padding-bottom: 10px; }
.it li:last-child { padding-bottom: 0; }
.it li:not(:last-child)::before { content: ""; position: absolute; left: 66px; top: 17px; bottom: -3px; width: 4px;
                                  border-radius: 2px; background: var(--seg); }
.it .t { text-align: right; font-size: 16px; line-height: 22px; white-space: nowrap; }
.it .t b { font-weight: 700; }
.it .t s { display: block; font-size: 11px; line-height: 13px; }
.it li.first .t, .it li.end .t { font-size: 20px; }
.it li.end .t b { color: var(--arrive); }
.it .t b.late, .it li.end .t b.late { color: var(--warn); }
.it .dot { width: 14px; height: 14px; margin: 4px auto 0; border-radius: 50%; background: var(--panel);
           border: 3px solid var(--seg); position: relative; z-index: 1; }
.it li.first .dot, .it li.end .dot { margin-top: 5px; }
.it li.end .dot { border-color: var(--arrive); background: var(--arrive); }
.it .n { font-size: 15px; line-height: 22px; min-width: 0; }
.it li.first .n, .it li.end .n { line-height: 26px; }
.it .n small { display: block; font-size: 12px; line-height: 17px; color: var(--muted); }
.it .n small.bad { color: var(--bad); font-weight: 600; }
.it .n small.warn { color: var(--warn); font-weight: 600; }
.it .n small.alt { color: var(--accent); }
.it .tr { display: flex; align-items: center; gap: 5px; font-size: 14px; line-height: 22px; justify-self: end; white-space: nowrap; }
.it li.first .tr, .it li.end .tr { line-height: 26px; }

/* ── 篩選 (右上角按鈕打開) ── */
.fp { margin: 12px 16px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 2px 14px; }
.fp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; font-size: 15px; cursor: pointer; }
.fp-row + .fp-row { border-top: 1px solid var(--line); }
.sw { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: #34425C;
      position: relative; flex: none; cursor: pointer; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
             background: #fff; transition: transform .2s; }
.sw:checked { background: var(--arrive); }
.sw:checked::after { transform: translateX(18px); }
.sw:disabled { opacity: .4; }

/* ── 時刻表改動備註 (預設收合) ── */
.chg { margin: 16px 16px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.chg summary { list-style: none; cursor: pointer; padding: 12px 14px; font-size: 13.5px; color: var(--muted);
               display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.chg summary::-webkit-details-marker { display: none; }
.chg summary b { color: var(--text); font-weight: 600; }
.chg summary .chev { margin-left: auto; }
.chg[open] summary .chev, .setup[open] summary .chev { transform: rotate(90deg); }
.chg-n { color: var(--faint); }
.chg h4 { margin: 6px 14px 4px; font-size: 13px; }
.chg ul { list-style: none; padding: 0 14px 12px; font-size: 13px; color: var(--muted); line-height: 1.7; }
.chg li b { color: var(--text); }
.chg .add { color: var(--arrive); } .chg .rem { color: var(--bad); } .chg .mod { color: var(--warn); }

/* ── 即時動態: 四站看板 ── */
.lv-bar { position: sticky; top: var(--ah-h, 100px); z-index: 10; background: var(--bg); padding: 10px 16px;
          display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.seg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 3px; border-radius: 12px;
        background: var(--panel); border: 1px solid var(--line); }
.seg4 button { padding: 8px 0; border-radius: 9px; font-size: 15px; color: var(--muted); }
.seg4 button.on { background: var(--raised); color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--line2); }
.chips { display: flex; gap: 6px; }
.chip-b { padding: 5px 13px; border-radius: 16px; border: 1px solid var(--line2); font-size: 13px; color: var(--muted); }
.chip-b.on { border-color: rgba(90,169,255,.6); color: var(--accent); background: var(--accent-bg); }
.lv-row { display: grid; grid-template-columns: 64px minmax(0,1fr) auto 62px; align-items: center; gap: 10px;
          padding: 10px 16px; border-bottom: 1px solid var(--line); }
.lv-t { font-size: 20px; font-weight: 700; line-height: 24px; }
.lv-t.late { color: var(--warn); }
.lv-t s { display: block; font-size: 11.5px; line-height: 14px; }
.lv-tr { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lv-tr div:first-child { display: flex; align-items: center; gap: 6px; font-size: 15px; }
.lv-dir { font-size: 12px; color: var(--faint); }
.lv-cd { text-align: right; font-size: 18px; font-weight: 700; white-space: nowrap; }
.lv-cd small { font-size: 11.5px; font-weight: 500; color: var(--faint); }
.lv-cd.soon { color: var(--accent); }
.lv-note { margin: 12px 16px 0; font-size: 12px; color: var(--faint); line-height: 1.6; }

/* ── 設定 (即時動態頁最下面, 預設收合): 代理網址 / 版本 / 偵錯 Log ── */
.setup { margin: 16px 16px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.setup summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 13px 14px;
                 font-size: 14px; color: var(--muted); }
.setup summary::-webkit-details-marker { display: none; }
.setup summary > svg:first-child { width: 18px; height: 18px; flex: none; }
.setup .sum { margin-left: auto; font-size: 12.5px; color: var(--faint); }
.set-sec { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
.set-h { font-size: 12.5px; font-weight: 700; color: var(--faint); margin-bottom: 8px; letter-spacing: .3px; }
.setup-row { display: flex; gap: 6px; flex-wrap: wrap; }
/* 16px: 小於 16px 的輸入框在 iPhone 上一點就會把整頁放大 */
.setup-row input { flex: 1; min-width: 170px; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line2);
                   background: var(--bg); color: var(--text); font-size: 16px; }
.btn { padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line2); background: var(--raised);
       color: var(--text); font-size: 13.5px; white-space: nowrap; }
.btn.pri { border-color: rgba(90,169,255,.6); color: var(--accent); }
.btn[disabled] { opacity: .5; }
.setup-note { font-size: 12px; color: var(--faint); margin-top: 7px; line-height: 1.5; }
.setup-note.ok { color: var(--arrive); } .setup-note.warn { color: var(--warn); } .setup-note.err { color: var(--bad); }
.setup-note .btn { margin-top: 8px; }
.set-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 14px; }
.set-line b { font-weight: 600; font-variant-numeric: tabular-nums; }
.log-pre { margin-top: 8px; max-height: 260px; overflow: auto; padding: 10px; border-radius: 9px; background: var(--bg);
           border: 1px solid var(--line); font: 11.5px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted);
           white-space: pre-wrap; word-break: break-all; -webkit-user-select: text; user-select: text; }

@media (prefers-reduced-motion: reduce) { .rf.spin svg { animation-duration: 2.4s; } .chev { transition: none; } }

  return isShift(t, d, now) ? '<b class="late">' + fmtMin(t + d) + "</b><s>" + fmtMin(t) + "</s>"
                            : "<b>" + fmtMin(t) + "</b>";
}
// 預計抵達: 有變動就顯示新時間 + 劃線的表定; 算不出來 (前段就接不上) 顯示「—」
function arrHtml(r, a, tag, cls) {
  var o = "<" + tag + ' class="' + cls, e = "</" + tag + ">";
  if (a.arr === null) return o + ' late">—<s>' + fmtMin(r.arr) + "</s>" + e;
  if (a.arr !== r.arr) return o + ' late">' + fmtMin(a.arr) + "<s>" + fmtMin(r.arr) + "</s>" + e;
  return o + '">' + fmtMin(r.arr) + e;
}

function itinHtml(r, a, now) {
  var L = a.legs, h = '<ol class="it">';
  L.forEach(function (l, i) {
    var sub = "";
    if (i) {
      var p = L[i - 1], x = a.xs[i - 1];
      var at = fmtMin(p.tt + (isShift(p.tt, p.d, now) ? p.d : 0));
      if (x.s === "bad") {
        sub = '<small class="bad">' + at + " 到站，趕不上 " + l.num + "</small>";
        sub += x.alt ? '<small class="alt">改搭 ' + fmtMin(x.alt.dep + x.alt.d) + " " + (SHORT[x.alt.type] || x.alt.type) +
                       " " + x.alt.num + "，" + fmtMin(x.alt.arr + x.alt.d) + " 到" + l.to + "</small>"
                     : '<small class="alt">今天已經沒有接得上的車</small>';
      } else if (x.s === "warn") sub = '<small class="warn">' + at + " 到站，只剩 " + x.eff + " 分可換車</small>";
      else if (x.s === "chg") sub = "<small>" + at + " 到・實際等 " + x.eff + " 分</small>";
      else sub = "<small>" + at + " 到・等 " + x.wait + " 分</small>";
    }
    h += '<li class="' + (i ? "xf" : "first") + '" style="--seg:var(--' + tcls(l.type) + ')">' +
         '<span class="t">' + tmIt(l.ft, l.d, now) + '</span><span class="dot"></span>' +
         '<span class="n">' + l.from + sub + "</span>" +
         '<span class="tr">' + pill(l.type, true) + '<span class="tn">' + l.num + "</span>" + dchip(l.d) + "</span></li>";
  });
  var z = L[L.length - 1];
  h += '<li class="end"><span class="t">' + arrHtml(r, a, "b", "") + '</span><span class="dot"></span>' +
       '<span class="n">' + z.to + '</span><span class="tr"><span class="muted">抵達</span></span></li>';
  return h + "</ol>";
}

function nowLineHtml(nr, now) {
  var t = nr ? "下一班 " + fmtMin(nr.dep) + " · " + durStr(nr.dep - now) + "後" : "今天沒有班次了";
  return '<div class="now" id="now"><b>現在 ' + fmtMin(now) + "</b><i></i><span>" + t + "</span></div>";
}
function filterHtml() {
  if (!app.showF) return "";
  function row(k, t) {
    return '<label class="fp-row"><span>' + t + '</span><input type="checkbox" class="sw" data-f="' + k + '"' +
           (app.filt[k] ? " checked" : "") + "></label>";
  }
  return '<div class="fp">' + row("fastest", "每個出發時間只留最快") + row("within2h", "只顯示 2 小時內到") +
         row("unnec", "顯示「多此一舉」的轉乘") + "</div>";
}
function changesHtml(dir) {
  var c = CHANGES && CHANGES[dir];
  if (!c) return "";
  function stops(o) { return Object.keys(o).map(function (s) { return s + " " + o[s]; }).join(" / "); }
  function item(t, body) { return "<li>" + pill(t[1]) + " <b>" + t[0] + "</b>　" + body + "</li>"; }
  var n = c.added.length + c.removed.length + c.modified.length;
  var h = '<details class="chg"><summary><span>時刻表改動 <b>' + VER.old + " → " + VER["new"] + "</b></span>" +
          '<span class="chg-n">' + (n ? "新增 " + c.added.length + "・取消 " + c.removed.length + "・調整 " + c.modified.length
                                      : "這個方向沒有變動") + "</span>" + CHEV + "</summary>";
  if (c.added.length) h += '<h4 class="add">新增</h4><ul>' + c.added.map(function (t) { return item(t, stops(t[2])); }).join("") + "</ul>";
  if (c.removed.length) h += '<h4 class="rem">取消</h4><ul>' + c.removed.map(function (t) { return item(t, stops(t[2])); }).join("") + "</ul>";
  if (c.modified.length) h += '<h4 class="mod">時間調整</h4><ul>' + c.modified.map(function (t) {
    return item(t, t[2].map(function (d) { return d[0] + " " + (d[1] || "無停") + "→" + (d[2] || "無停"); }).join("，"));
  }).join("") + "</ul>";
  return h + "</details>";
}

function renderRoutes() {
  var host = el("view-routes");
  if (!host) return;
  var dir = app.tab === "N" ? "N" : "S", now = nowMin(), rs = routesFor(dir), ni = -1;
  for (var i = 0; i < rs.length; i++) { if (rs[i].dep >= now) { ni = i; break; } }
  var h = filterHtml();
  if (!rs.length) h += '<div class="empty">這個篩選條件下沒有班次</div>';
  else {
    h += '<div class="la">';
    rs.forEach(function (r, i) {
      if (i === ni) h += nowLineHtml(r, now);
      var a = analyse(r, dir, now), k = routeKey(r);
      var open = app.open[k] !== undefined ? app.open[k] : (i === ni);   // 下一班預設展開
      var gone = (a.arr === null ? r.arr : a.arr) < now;
      h += '<div class="la-row' + (gone ? " gone" : "") + (open ? " open" : "") + '" data-k="' + k + '">' +
           '<button class="la-sum" type="button" aria-expanded="' + open + '">' +
           '<span class="la-t">' + fmtMin(r.dep) + '</span><span class="la-ar">→</span>' + arrHtml(r, a, "span", "la-t arr") +
           '<span class="la-meta"><span class="la-dur">' + durStr(r.total) + "</span>" + chipHtml(a.chip) + "</span>" + CHEV +
           '</button><div class="la-det">' + itinHtml(r, a, now) + "</div></div>";
    });
    if (ni === -1) h += nowLineHtml(null, now);
    h += "</div>";
  }
  host.innerHTML = h + changesHtml(dir);
  app.rendered = Date.now();
}

/* ═════════════ 即時動態 (TDX 誤點; 只在按 ↻ 時更新) ═════════════ */
var LIVE = {delays: null, mock: false, stamp: null, at: null,
            lean: false, calls: null, capped: false, points: null, budget: 3};

// 代理網址只存在這台裝置, 不在公開的 HTML 裡。
// 三層來源: localStorage → 這次開啟時從 #setup= 讀到的值 → 內建 (永遠是空的)。
// 中間那層是為了「localStorage 被擋掉或被清掉」的情況, 見 consumeSetupHash()。
var MEM_PROXY = "";
function proxyUrl() {
  try { var v = localStorage.getItem("tdxProxy"); if (v) return v; } catch (e) {}
  return MEM_PROXY || PROXY_URL;
}
function setStatus(msg, cls) {
  var s = el("live-status");
  if (!s) return;
  s.textContent = msg;
  s.className = "ah-st" + (cls ? " " + cls : "");
  setAhVar();
}
function setupNote(msg, cls) {
  var n = el("setup-note");
  if (n) { n.textContent = msg; n.className = "setup-note" + (cls ? " " + cls : ""); }
}
function refreshSetupNote() {
  var u = proxyUrl();
  if (!u) setupNote("尚未設定。沒有網址時按 ↻ 只會產生示範資料；貼上代理網址後才會取得真實誤點。", "warn");
  else setupNote("已設定：" + u.slice(0, 46) + (u.length > 46 ? "…" : ""), "ok");
}
function refreshSetupSummary() {
  var s = el("setup-sum");
  if (s) s.textContent = (proxyUrl() ? "代理已設定" : "代理未設定") + " · " + BUILD;
}
function onSetupToggle(d) {
  if (!d.open) return;
  var i = el("setup-url");
  if (i) i.value = lsGet("tdxProxy") || "";
  refreshSetupNote();
}
function saveSetup() {
  var i = el("setup-url");
  var v = ((i && i.value) || "").replace(/\s+/g, "");   // 從聊天視窗複製的長網址常夾到換行/空白
  if (v && v.indexOf("https://") !== 0) {
    setupNote("網址要以 https:// 開頭", "warn");
    return false;
  }
  try { localStorage.setItem("tdxProxy", v); }
  catch (e) { setupNote("這個瀏覽器不讓我儲存設定", "warn"); return false; }
  dlog("儲存代理網址 " + maskUrl(v));
  refreshSetupNote(); refreshSetupSummary();
  if (!LIVE.delays) initStatus();
  if (v) refreshLive();       // 剛貼上網址: 立刻抓一次, 網址打錯當場就看得出來
  return true;
}
// 換圖示要把主畫面捷徑刪掉重加, 而主畫面 App 沒有網址列可以複製 → 在這裡直接產生帶 #setup= 的連結
function copySetupLink() {
  var u = proxyUrl();
  if (!u) { setupNote("先儲存代理網址，才能產生主畫面用的連結", "warn"); return false; }
  var link = location.href.split("#")[0].split("?")[0] + "#setup=" + encodeURIComponent(u);
  function fallback() { setupNote("請長按選取這串網址後拷貝：" + link, ""); }
  dlog("複製主畫面連結");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(function () {
      setupNote("已複製。用 Safari 開這個連結 → 分享 → 加入主畫面", "ok");
    }, fallback);
  } else fallback();
  return true;
}
function clearSetup() {
  try { localStorage.removeItem("tdxProxy"); } catch (e) {}
  var i = el("setup-url");
  if (i) i.value = "";
  dlog("清除代理網址");
  refreshSetupNote(); refreshSetupSummary();
  if (!LIVE.delays) initStatus();
}
// 一鍵設定: 網址帶 #setup=<代理網址> 開啟即完成設定。
//
// 刻意「不」把 hash 清掉 —— 這是 iPhone 上的必要設計, 踩過:
//   1. 加到主畫面的 App 有自己的儲存空間, 不一定跟 Safari 共用 localStorage;
//   2. Safari 的 ITP 會定期清掉 script 寫入的 localStorage;
//   3. 若從「已清掉 hash」的網址加到主畫面, 那個捷徑就再也沒有東西能種回設定。
// 把 #setup= 留在網址裡, 主畫面捷徑每次開啟都會重新種回去, 上面三種情況全部免疫。
// 代價: 網址變長, 分享連結時會把代理網址一起帶出去 —— 自用 App 可接受。
var HASH_REJECTED = false;   // 網址帶了 #setup= 但用不了 —— 要講出來, 不能默默當沒設定
function consumeSetupHash() {
  // 先把空白與換行清掉: 從聊天視窗/郵件複製長網址時很容易夾到折行字元,
  // 而 . 不match 換行, 不清的話整條規則直接失效, 症狀是「明明貼了卻說尚未設定」
  var raw = (location.hash || "").replace(/\s+/g, "");
  if (raw.indexOf("#setup=") !== 0) return false;
  var v = raw.slice(7);
  try { v = decodeURIComponent(v); } catch (e) { /* 半個 % 之類的壞編碼, 當原字串用 */ }
  v = v.trim();
  if (v.indexOf("https://") !== 0) { HASH_REJECTED = true; return false; }
  MEM_PROXY = v;                                     // localStorage 失敗也還能用
  try { localStorage.setItem("tdxProxy", v); } catch (e) {}
  return true;
}
// 開啟時讓「有沒有設定好」看得見, 不要讓它默默失敗
function initStatus() {
  if (proxyUrl()) {
    setStatus("已設定代理 · 要看誤點時按右下 ↻", "");
  } else if (HASH_REJECTED) {
    setStatus("網址的 #setup= 認不得（要以 https:// 開頭）· 請到「即時動態」最下面的設定直接貼上網址", "err");
  } else {
    setStatus("尚未設定代理（在「即時動態」最下面設定）· 現在按 ↻ 只會顯示示範資料", "warn");
  }
}

// 唯一會打網路的地方: 只有按右下 ↻ (或剛儲存代理網址) 才會呼叫。打開 App 不會自動抓。
var busy = false;
function refreshLive() {
  if (busy) return;                                  // 連按不重複打
  var btn = el("refresh-btn"), url = proxyUrl();
  busy = true;
  if (btn) btn.classList.add("spin");
  setStatus("更新中…", "busy");
  dlog("按下更新 · " + (url ? "代理 " + maskUrl(url) : "未設定代理，改用示範資料"));
  function done() { busy = false; if (btn) btn.classList.remove("spin"); }
  if (!url) {   // 還沒接上代理: 用示範資料把整條流程跑完
    setTimeout(function () { applyLive(buildMock(), true); done(); }, 300);
    return;
  }
  var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);   // GAS 冷啟動會慢, 但不能永遠轉圈
  fetch(url, ctl ? {cache: "no-store", signal: ctl.signal} : {cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (j) {
      if (j && j.error) throw new Error(j.error);
      applyLive(j, false);
    })
    .catch(function (e) {
      var m = (e && e.name === "AbortError") ? "逾時（20 秒沒有回應）" : ((e && e.message) || String(e));
      dlog("更新失敗：" + m);
      setStatus("更新失敗：" + m + (LIVE.delays ? "（仍顯示 " + LIVE.stamp + " 的資料）" : ""), "err");
    })
    .then(function () { clearTimeout(timer); done(); });
}

function applyLive(payload, isMock) {
  LIVE.delays = (payload && payload.delays) || {};
  LIVE.lean   = !!(payload && payload.lean);
  LIVE.calls  = (payload && payload.calls) || null;
  LIVE.capped = (payload && payload.capped) || false;   // false | "day" | "month" | true
  LIVE.points = (payload && typeof payload.points === "number") ? payload.points : null;
  LIVE.budget = (payload && payload.budget) || 3;
  LIVE.mock = isMock;
  LIVE.at = Date.now();
  LIVE.stamp = fmtMin(nowMin());
  var n = 0, late = 0, worst = 0;
  for (var k in LIVE.delays) {
    n++;
    if (LIVE.delays[k] > 0) { late++; if (LIVE.delays[k] > worst) worst = LIVE.delays[k]; }
  }
  var capWord = (LIVE.capped === "day") ? "今日" : "本月";
  var msg = isMock ? "示範資料（尚未設定代理）· "
          : (LIVE.capped ? capWord + "額度已達上限，顯示最後一筆快取 · " : "");
  msg += LIVE.stamp + " 更新 · " + (late ? late + " 班誤點，最多 " + worst + " 分" : "目前沒有誤點");
  if (LIVE.points !== null) msg += " · 本月 " + LIVE.points.toFixed(2) + "/" + LIVE.budget + " 點";
  else if (LIVE.calls) msg += " · 本月已用 " + LIVE.calls + " 次";
  setStatus(msg, (isMock || LIVE.capped) ? "warn" : "ok");
  dlog("更新完成：" + (isMock ? "示範資料" : "TDX") + " · " + n + " 班有資料、誤點 " + late + " 班" +
       (LIVE.lean ? " · 省量模式" : "") + (LIVE.capped ? " · 額度上限(" + LIVE.capped + ")" : "") +
       (LIVE.points !== null ? " · 本月 " + LIVE.points.toFixed(3) + " 點" : ""));
  var y = window.pageYOffset || 0;
  renderRoutes(); renderBoard();
  window.scrollTo(0, y);      // 疊上誤點時畫面不要跳走
}

// 誤點資料放太久就收起來 (不會自動重抓, 只是不再把舊資料當現況)
function expireStale() {
  if (!LIVE.delays || !LIVE.at || Date.now() - LIVE.at < LIVE_TTL) return false;
  dlog("誤點資料已超過 30 分鐘（" + LIVE.stamp + "），收起來");
  LIVE.delays = null; LIVE.at = null;
  setStatus("誤點資料已過時（" + LIVE.stamp + " 的）· 要看時按右下 ↻", "");
  return true;
}

// 示範資料: 從表定看板挑出「此刻前後會在線上」的車次, 隨機給誤點
function buildMock() {
  var t = nowMin(), delays = {}, seen = {};
  STATIONS_4.forEach(function (s) {
    (STATION_BOARD[s] || []).forEach(function (r) {
      if (seen[r[0]]) return;
      var rel = hmToMin(r[2]) - t;
      if (rel < -720) rel += 1440;
      if (rel > -90 && rel < 150) {
        seen[r[0]] = 1;
        var x = Math.random();
        delays[r[0]] = x < 0.62 ? 0
                     : (x < 0.9 ? Math.ceil((x - 0.62) * 40)
                                : Math.ceil((x - 0.9) * 250));
      }
    });
  });
  return {delays: delays};
}

// 車站看板: 以表定為底, 疊上誤點, 依「實際到離站時間」排序
function renderBoard() {
  var host = el("live-board");
  if (!host) return;
  var t = nowMin(), rows = [];
  (STATION_BOARD[liveState.station] || []).forEach(function (r) {
    if (liveState.dir && r[3] !== liveState.dir) return;
    var sch = hmToMin(r[2]);
    var rel = sch - t;
    if (rel < -300) rel += 1440;          // 跨午夜: 凌晨班次視為今天稍晚
    var dly = null;
    if (LIVE.delays) {
      if (LIVE.delays[r[0]] !== undefined) {
        dly = LIVE.delays[r[0]];
      } else if (LIVE.lean && rel > -30 && rel < 120) {
        // 省量模式只抓誤點中的車 → 近期班次沒被列出就代表沒誤點。
        // 窗口外的車可能只是還沒發車, 不能當準點, 不標示。
        dly = 0;
      }
    }
    var relAct = rel + (dly || 0);
    if (relAct < -2) return;              // 已過站 (進站前後 2 分鐘內仍列出)
    rows.push({no: r[0], type: r[1], dir: r[3], sch: sch, dly: dly, rel: relAct});
  });
  rows.sort(function (a, b) { return a.rel - b.rel; });
  if (rows.length > 60) rows = rows.slice(0, 60);
  var h = rows.length ? "" : '<div class="empty">這個條件下沒有班次</div>';
  rows.forEach(function (r) {
    var late = r.dly !== null && r.dly > 0;
    h += '<div class="lv-row"><div class="lv-t' + (late ? " late" : "") + '">' + fmtMin(r.sch + (late ? r.dly : 0)) +
         (late ? "<s>" + fmtMin(r.sch) + "</s>" : "") + "</div>" +
         '<div class="lv-tr"><div>' + pill(r.type) + '<span class="tn">' + r.no + "</span></div>" +
         '<div class="lv-dir">' + (DIR_NAME[r.dir] || r.dir) + "</div></div>" +
         "<div>" + dchip(r.dly) + "</div>" +
         '<div class="lv-cd' + (r.rel <= 15 ? " soon" : "") + '">' + (r.rel <= 0 ? "進站中" : r.rel + "<small> 分</small>") +
         "</div></div>";
  });
  var noteMiss = !LIVE.delays ? ""
    : (LIVE.lean ? "目前為省用量模式，只抓誤點中的列車：近一兩小時內沒被標示的車即為準點，更早或更晚的班次不標示。"
                 : "沒有標示的班次代表還沒發車，或 TDX 沒有即時資料。");
  h += '<p class="lv-note">時刻為本版時刻表的表定時間，按右下 ↻ 才會疊上 TDX 即時誤點。' + noteMiss +
       "台鐵明言即時資料不應拿來跟月台的 TIDS 看板比對，月台螢幕才是最終依據。</p>";
  host.innerHTML = h;
}
function setLiveStation(s, btn) {
  liveState.station = s;
  if (btn && btn.parentElement) btn.parentElement.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b === btn); });
  renderBoard();
}
function setLiveDir(d, btn) {
  liveState.dir = d;
  if (btn && btn.parentElement) btn.parentElement.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b === btn); });
  renderBoard();
}

/* ═════════════ 版本: 顯示目前版本 / 檢查更新 ═════════════
   主畫面 App 沒有重新整理鈕, 發版後舊頁面可能一直留在記憶體裡 —— 這裡按一下就能確認並換成新版 */
function checkUpdate() {
  var note = el("ver-note"), btn = el("ver-btn");
  function say(t, c) { note.textContent = t; note.className = "setup-note" + (c ? " " + c : ""); }
  if (btn) btn.disabled = true;
  say("檢查中…");
  var base = location.href.split("#")[0].split("?")[0];
  return fetch(base + "?check=" + Date.now(), {cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (t) {
      var m = /<meta name="build" content="([^"]+)">/.exec(t);
      var n = /<meta name="build-note" content="([^"]*)">/.exec(t);
      if (!m) throw new Error("讀不到線上版本");
      dlog("檢查更新：線上 " + m[1] + " / 這台 " + BUILD);
      if (m[1] === BUILD) { say("已是最新版", "ok"); return; }
      say("有新版 " + m[1] + (n && n[1] ? "：" + n[1] : ""), "warn");
      var go = document.createElement("button");
      go.className = "btn pri"; go.type = "button"; go.textContent = "載入新版";
      // 換網址強迫重抓 (直接 reload 可能拿到快取的舊檔); #setup= 要跟著帶, 設定才不會掉
      go.onclick = function () { location.replace(base + "?v=" + encodeURIComponent(m[1]) + location.hash); };
      note.appendChild(document.createElement("br"));
      note.appendChild(go);
    })
    .catch(function (e) {
      dlog("檢查更新失敗：" + ((e && e.message) || e));
      say("檢查失敗：" + ((e && e.message) || e) + "（沒有網路？）", "err");
    })
    .then(function () { if (btn) btn.disabled = false; });
}

function initSettings() {
  var on = el("log-on"), cl = el("log-clear"), v = el("ver-cur");
  if (on) on.checked = logOn();
  if (cl) { cl.checked = logClearOnOpen(); cl.disabled = !logOn(); }
  if (v) v.textContent = BUILD;
  refreshSetupSummary();
}

/* ═════════════ 啟動 ═════════════ */
document.addEventListener("DOMContentLoaded", function () {
  logBoot();
  var hashOk = consumeSetupHash();                   // 網址有 #setup= 就(重新)種回設定
  dlog("網址 #setup=：" + (hashOk ? "已套用" : (HASH_REJECTED ? "格式不對，沒有套用" : "沒有帶")) +
       " · 代理" + (proxyUrl() ? "已設定 " + maskUrl(proxyUrl()) : "未設定"));
  try { localStorage.removeItem("tdxAuto"); } catch (e) {}   // 舊版「自動更新」的偏好, 功能已拿掉
  initStatus();                                      // 打開 App 不抓誤點, 只講清楚現在的設定狀態
  initSettings();
  el("view-routes").addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest(".la-sum") : null;
    if (!b) return;
    var row = b.parentNode, open = !row.classList.contains("open");
    row.classList.toggle("open", open);
    b.setAttribute("aria-expanded", open ? "true" : "false");
    app.open[row.dataset.k] = open;
  });
  el("view-routes").addEventListener("change", function (e) {
    var k = e.target && e.target.dataset ? e.target.dataset.f : null;
    if (k) setFilter(k, e.target.checked);
  });
  showTab("S");
  // 看板每 30 秒重算倒數 (純本機計算, 不打網路)
  setInterval(function () { if (app.tab === "L" && !document.hidden) renderBoard(); }, 30000);
  window.addEventListener("resize", setAhVar);
});
// 從背景回來: 不抓誤點; 只把過時的誤點收起來, 離開夠久就重畫並捲回「現在」
document.addEventListener("visibilitychange", function () {
  if (document.hidden) return;
  var stale = expireStale(), away = Date.now() - app.rendered > 5 * 60000;
  if (app.tab === "L") renderBoard();
  else if (stale || away) { renderRoutes(); if (away) scrollToNow(); }
});
window.addEventListener("error", function (e) {
  dlog("JS 錯誤：" + ((e && e.message) || e) + " @" + ((e && e.lineno) || "?"));
});
</script>
